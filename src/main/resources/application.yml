spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mydb?createDatabaseIfNotExist=true   # mydb가 없으면 자동 생성
    username: root
    password: "ssafy"
  jpa:
    hibernate:
      ddl-auto: validate      # create / update 아님! DB 변경은 Flyway, JPA는 검사만
    open-in-view: false
  flyway:
    enabled: true             # 기본값이 true라 생략해도 됨
    locations: classpath:db/migration   # 공통(운영 기준): 모든 환경에 들어가야 하는 마이그레이션만
